<style>

<script>
const $=id=>document.getElementById(id);

let audioCtx;
try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { console.log('Audio disabled'); }

function playSound(type){
  if(!audioCtx) return;
  if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  const t=audioCtx.currentTime;
  if(type==='ok'){osc.type='sine';osc.frequency.setValueAtTime(800,t);osc.frequency.exponentialRampToValueAtTime(1200,t+.1);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.5);osc.start(t);osc.stop(t+.5);}
  else if(type==='no'){osc.type='sawtooth';osc.frequency.setValueAtTime(150,t);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.3);osc.start(t);osc.stop(t+.3);}
  else if(type==='crash'){osc.type='square';osc.frequency.setValueAtTime(100,t);osc.frequency.exponentialRampToValueAtTime(20,t+.3);gain.gain.setValueAtTime(.5,t);gain.gain.exponentialRampToValueAtTime(.01,t+.5);osc.start(t);osc.stop(t+.5);}
  else if(type==='boost'){osc.type='sine';osc.frequency.setValueAtTime(400,t);osc.frequency.linearRampToValueAtTime(1600,t+.3);gain.gain.setValueAtTime(.4,t);gain.gain.linearRampToValueAtTime(.01,t+.5);osc.start(t);osc.stop(t+.5);}
}

const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=v=>String(Math.round(v*100)/100);
const sum=a=>a.reduce((s,v)=>s+v,0), mean=a=>sum(a)/a.length;
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length,m=n>>1;return n%2?s[m]:(s[m-1]+s[m])/2};

function gMean(){
  const n=R(3,4); let a;
  do { a = Array.from({length:n}, ()=>R(2,15)); } while(sum(a)%n !== 0);
  const m = mean(a);
  return {t:'평균',q:`다음 숫자의 평균은?\n${a.join(', ')}`,h:'모든 수를 더한 후 개수만큼 나눕니다.',ans:m,d:[m+1,m-1,m+2,m-2],n:`합계 ${sum(a)} ÷ ${n} = ${m}`}
}
function gMed(){
  const a=Array.from({length:5},()=>R(5,30));
  const ans=med(a); const s=[...a].sort((x,y)=>x-y);
  return {t:'중앙값',q:`다음 숫자를 크기순으로 나열할 때\n가운데 있는 수는?\n${a.join(', ')}`,h:'작은 수부터 차례대로 정렬했을 때 정중앙에 위치한 값',ans:ans,d:[s[0],s[4],ans+1,ans-1],n:`정렬: ${s.join(', ')} → 중앙값 ${ans}`}
}
function gEqu(){
  const a=R(2,5), x=R(2,9), b=R(1,10), op=R(0,1)?'+':'-';
  const c=op==='+'?a*x+b:a*x-b;
  return {t:'방정식',q:`다음 x의 값은?\n${a}x ${op} ${b} = ${c}`,h:'x만 남기고 나머지를 넘겨서 계산합니다.',ans:x,d:[x+1,x-1,x+2,x-2],n:`${a}x = ${c} ${op==='+'?'-':'+'} ${b} = ${a*x} → x = ${x}`}
}
function gSeq(){
  const a=R(2,10), d=R(2,6), seq=[a, a+d, a+d*2, a+d*3], ans=a+d*4;
  return {t:'규칙 찾기',q:`다음에 올 숫자는?\n${seq.join(', ')}, ?`,h:'숫자가 일정하게 커지는 규칙을 찾으세요.',ans:ans,d:[ans+1,ans-1,ans+d,ans-d],n:`${d}씩 커지는 규칙 → ${seq[3]} + ${d} = ${ans}`}
}
const G=[gMean,gMed,gEqu,gSeq];let lastG=-1;const seen=new Set();
function genQ(){let q,g;for(let k=0;k<9;k++){do{g=R(0,3)}while(g===lastG);q=G[g]();if(!seen.has(q.q))break}
  lastG=g;seen.add(q.q);const A=fmt(q.ans),S=new Set([A]);for(const v of sh([...q.d])){if(S.size>=4)break;S.add(fmt(v))}
  for(let k=1;S.size<4;k++)S.add(fmt(q.ans+k*(k%2?1:-1)));q.opts=sh([...S]);q.A=A;return q}

const scene=new THREE.Scene();
scene.background = new THREE.Color(0x0a1426);
scene.fog = new THREE.Fog(0x0a1426, 60, 230);

const sg=new THREE.BufferGeometry(),SP=new Float32Array(450*3);for(let i=0;i<450;i++){SP[i*3]=R(-70,70);SP[i*3+1]=R(2,60);SP[i*3+2]=R(-250,20)}

for(const x of [-.34,.34]){const seat=addCarPart(new THREE.BoxGeometry(.42,.17,.48),darkPaint,[x,.80,-.27]);seat.rotation.x=-.12;}
addCarPart(new THREE.BoxGeometry(1.28,.055,.48),glassMat,[0,.92,.47],[.52,0,0]);

const flameMat=new THREE.MeshBasicMaterial({color:0x52f2ff,transparent:true,opacity:.85});

for(const x of [-.48,.48]){const flame=new THREE.Mesh(new THREE.ConeGeometry(.20,.95,8),flameMat);flame.rotation.x=-Math.PI/2;flame.position.set(x,.32,-2.45);car.add(flame);flames.push(flame);}

aura.visible=false;car.add(aura);

  if(solid)box(g,-W/2,W/2,0,H,solidMat);else{const s=Math.min(1,wi/40),hw=2.7-s*.5,hh=2.3-s*.4,cx=(Math.random()*2-1)*(W/2-hw-.5),cy=hh+1+Math.random()*(H-2*hh-2);Object.assign(w,{cx,cy,hw,hh});
    box(g,-W/2,cx-hw,0,H,wallMat);box(g,cx+hw,W/2,0,H,wallMat);box(g,cx-hw,cx+hw,0,cy-hh,wallMat);box(g,cx-hw,cx+hw,cy+hh,H,wallMat)}

}

let gameMode='easy', best=0;

let qTimer=null, tLeft=15;

function hud(){
  $('hs').textContent='◆'.repeat(Math.max(0,shield))+'◇'.repeat(3-Math.max(0,shield));
  $('hw').textContent=passed+' / '+broken;
  $('hb').textContent=Math.max(best,Math.floor(dist));
}

function reset(){
  walls.forEach(w=>scene.remove(w.g));walls.length=0;
  deb.forEach(d=>scene.remove(d.m));deb.length=0;
  items.forEach(i=>scene.remove(i));items.length=0;
  lasers.forEach(l=>scene.remove(l));lasers.length=0;
  
  wi=0;x=0;y=5;vx=vy=0;dist=0;shield=3;passed=broken=0;spawnD=0;boostTime=0;laserTimer=0;
  aura.visible=false;
  seen.clear();car.visible=true;hud();spawnWall();state='play'
}

function hurt(){shield--;shake=1;hud()}

function crash(){
  playSound('crash');
  state='crash';shake=2.5;car.visible=false;
  const c = gameMode==='hard'?0xff4d4d:0xffb04d;
  for(let i=0;i<40;i++){const m=new THREE.Mesh(dg,new THREE.MeshBasicMaterial({color:i%2?c:0xe1c8d6,transparent:true}));m.scale.setScalar(.15+Math.random()*.4);m.position.set(x,y+.4,0);deb.push({m,v:new THREE.Vector3((Math.random()-.5)*16,Math.random()*10,(Math.random()-.5)*16),l:1.5});scene.add(m)}
  setTimeout(()=>{if(state==='crash')over()},1100)
}

function over(){
  state='over';const d=Math.floor(dist);
  try{best=+localStorage.getItem('srb_best_'+gameMode)||0}catch(e){}
  const nb=d>best; if(nb){best=d;try{localStorage.setItem('srb_best_'+gameMode,d)}catch(e){}}
  hud();$('res').textContent=`난이도 [${gameMode.toUpperCase()}] · 비행 거리 ${d} m${nb?' · 신기록!':''} · 최고 ${best} m`;
  $('qm').classList.add('hidden');$('over').classList.remove('hidden')
}

function showQ(){
  cur=genQ();answered=false;tLeft=15;
  $('qtag').textContent='BREAK THE WALL · '+cur.t;
  $('qt').textContent=cur.q;$('qh').textContent=cur.h;
  $('fb').className='';$('nx').classList.add('hidden');
  $('ans').innerHTML=cur.opts.map((o,i)=>`<button class="a" data-i="${i}"><b>${i+1}</b>${o}</button>`).join('');
  
  $('t-bar').style.width='100%';$('t-bar').className='';
  $('qm').classList.remove('hidden');
  
  clearInterval(qTimer);
  qTimer=setInterval(()=>{
    if(answered){clearInterval(qTimer);return;}
    tLeft-=.1;
    $('t-bar').style.width=Math.max(0,(tLeft/15)*100)+'%';
    if(tLeft<=3)$('t-bar').className='u';
    if(tLeft<=0){clearInterval(qTimer);pick(-1);}
  },100);
}

function pick(i){
  if(answered)return;answered=true;clearInterval(qTimer);
  const ok=i>=0&&cur.opts[i]===cur.A;
  playSound(ok?'ok':'no'); 
  document.querySelectorAll('.a').forEach((b,j)=>{b.disabled=true;if(cur.opts[j]===cur.A)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  $('fbt').textContent=ok?'정답! 벽이 부서집니다':(i===-1?'시간 초과! 실드 −1':'오답! 실드 −1');
  $('fbn').textContent='풀이: '+cur.n;$('fb').className='on';
  
  if(!ok)hurt();const n=$('nx');n.classList.remove('hidden');n.textContent=ok?'벽 부수기 💥':shield>0?'새 문제 도전 →':'결과 보기';n.onclick=()=>{
    if(ok){$('qm').classList.add('hidden');explode(act);walls.splice(walls.indexOf(act),1);broken++;hud();shake=.6;state='play'}else if(shield>0)showQ();else over()}}

$('ans').onclick=e=>{const b=e.target.closest('.a');if(b)pick(+b.dataset.i)};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(state==='quiz'){if('1234'.includes(k)&&k)pick(+k-1);if(k==='enter'&&answered)$('nx').click()}if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

// --- 모바일 가상 조이스틱 터치 이벤트 ---
let joyActive=false,jx=0,jy=0,jStartX=0,jStartY=0;
$('game').addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  joyActive=true; jStartX=e.clientX; jStartY=e.clientY;
  const jBase=$('joy-base'), jKnob=$('joy-knob');
  jBase.style.left=jStartX+'px'; jBase.style.top=jStartY+'px';
  jBase.classList.remove('hidden'); jKnob.style.transform=`translate(-50%, -50%)`;
  jx=0; jy=0;
});
$('game').addEventListener('pointermove',e=>{
  if(!joyActive||state!=='play')return;
  e.preventDefault();
  let dx=e.clientX-jStartX, dy=e.clientY-jStartY, d=Math.sqrt(dx*dx+dy*dy), maxR=50;
  if(d>maxR){dx=(dx/d)*maxR; dy=(dy/d)*maxR;}
  $('joy-knob').style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  jx = dx/maxR; jy = -dy/maxR;
});
const endJoy=()=>{
  joyActive=false; jx=0; jy=0;
  const jBase=$('joy-base'); if(jBase)jBase.classList.add('hidden');
};
window.addEventListener('pointerup',endJoy);
window.addEventListener('pointercancel',endJoy);

function startGame(mode) {
  gameMode = mode;
  setTheme(mode);
  try{best=+localStorage.getItem('srb_best_'+gameMode)||0}catch(e){}
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  $('start').classList.add('hidden');
  reset();
}

$('btn-easy').onclick=()=>startGame('easy');
$('btn-hard').onclick=()=>startGame('hard');
$('rb').onclick=()=>{$('over').classList.add('hidden');$('start').classList.remove('hidden')};

function step(dt){
  const isBoost = boostTime > 0;
  speed=(28+Math.min(18,wi*.7)) * (isBoost ? 1.6 : 1);
  dist+=speed*dt;off+=speed*dt;
  
  $('hd').textContent = Math.floor(dist) + ' m';
  
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
  if(joyActive && !ix && !iy) { ix = jx; iy = jy; } // 조이스틱 입력 반영

  const k=Math.min(1,dt*6);vx+=(ix*14-vx)*k;vy+=(iy*11-vy)*k;x=clamp(x+vx*dt,-W/2+1,W/2-1);y=clamp(y+vy*dt,1.3,H-1.3);
  spawnD+=speed*dt;if(spawnD>=80){spawnD=0;spawnWall()}
  
  if(gameMode === 'hard'){
    laserTimer+=dt;
    if(laserTimer>0.9){ laserTimer=0; spawnLaser(); }
    for(let i=lasers.length-1;i>=0;i--){
      const l=lasers[i]; l.position.z+=(speed*1.8)*dt;
      if(l.position.z>-1 && l.position.z<1){
        if(Math.abs(l.position.x-x)<1.2 && Math.abs(l.position.y-(y+.5))<1.0){
          if(isBoost){ scene.remove(l);lasers.splice(i,1); continue; }
          else { crash(); return; }
        }
      }
      if(l.position.z>15){scene.remove(l);lasers.splice(i,1)}
    }
  }
  
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.position.z+=speed*dt;
    it.rotation.y+=5*dt; it.rotation.x+=3*dt;
    if(it.position.z>-2 && it.position.z<2 && Math.abs(it.position.x-x)<1.6 && Math.abs(it.position.y-y)<1.6){
       scene.remove(it);items.splice(i,1); boostTime=6; playSound('boost'); $('hd').classList.add('bst'); continue;
    }
    if(it.position.z>12){scene.remove(it);items.splice(i,1);}
  }
  
  for(let i=walls.length-1;i>=0;i--){
    const w=walls[i]; w.g.position.z+=speed*dt; const z=w.g.position.z;
    if(isBoost){
      if(!w.done && z > -6){ w.done=true; explode(w); walls.splice(i,1); broken++; hud(); playSound('crash'); shake=1.2; }
    } else {
      if(w.solid&&!w.done&&z>-18){ w.done=true;w.g.position.z=-18;act=w;state='quiz';showQ();return }
      if(!w.solid&&!w.done&&z>-1.2){
        w.done=true;
        if(Math.abs(x-w.cx)>w.hw-.95||Math.abs(y+.4-w.cy)>w.hh-.6){ crash();return }
        else{passed++;hud()}
      }
    }
    if(z>12){scene.remove(w.g);walls.splice(i,1)}
  }
}

function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(state==='play')step(dt);
  if(boostTime>0){
     boostTime-=dt; aura.visible=true; aura.rotation.y+=10*dt; aura.rotation.x+=5*dt;
     if(boostTime<=0) { aura.visible=false; $('hd').classList.remove('bst'); }
  }
  const sp=state==='play'?speed:state==='quiz'?0:6;
  for(let i=deb.length-1;i>=0;i--){const d=deb[i];d.l-=dt;d.v.y-=14*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=dt*4;d.m.material.opacity=Math.max(0,d.l/1.5);if(d.l<=0){scene.remove(d.m);deb.splice(i,1)}}
  for(let i=0;i<450;i++){SP[i*3+2]+=sp*dt;if(SP[i*3+2]>20)SP[i*3+2]-=270}sg.attributes.position.needsUpdate=true;
  if(grid) grid.position.z=-100+(off%10);
  car.position.set(x,y,0);car.rotation.set(vy*.03,Math.PI,vx*.035);flames.forEach(f=>f.scale.y=.7+Math.random()*.6);
  shake*=.92;cam.position.set(x*.6+(Math.random()-.5)*shake,y+3+(Math.random()-.5)*shake,10);cam.lookAt(x*.8,y+.5,-14);ren.render(scene,cam)}
hud();requestAnimationFrame(loop);
</script></body></html>
